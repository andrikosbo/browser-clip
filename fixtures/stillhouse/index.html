<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stillhouse Objects</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section class="intro" aria-labelledby="intro">
      <header>Stillhouse Objects<span>Design collection</span></header>
      <div class="hero">
        <div class="hero-copy">
          <p class="label">Collection 01</p>
          <h1 id="intro">Room<br>for light.</h1>
          <p>Three studies in shape and colour.</p>
        </div>
        <div class="art art-main" aria-hidden="true">
          <span class="orb"></span>
          <span class="arch"></span>
          <span class="step"></span>
        </div>
      </div>
    </section>
    <section class="studies" aria-labelledby="studies">
      <p class="label">The collection</p>
      <h2 id="studies">Light studies</h2>
      <ul>
        <li><div class="study blue" aria-hidden="true"></div><p>01 · Horizon</p></li>
        <li><div class="study apricot" aria-hidden="true"></div><p>02 · Eclipse</p></li>
        <li><div class="study green" aria-hidden="true"></div><p>03 · Passage</p></li>
      </ul>
    </section>
    <section class="closing" aria-labelledby="closing">
      <div class="closing-art" aria-hidden="true"></div>
      <div>
        <p class="label">Stillhouse Objects</p>
        <h2 id="closing">Past the<br>threshold.</h2>
      </div>
    </section>
  </main>
</body>
</html>
